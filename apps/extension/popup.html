<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>AutoLibras Tradutor</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #eef2f7;
        --border: #d6dde8;
        --text: #0f1724;
        --muted: #5b6678;
        --accent: #0f6e78;
        --on-accent: #ffffff;
        --danger: #c0352b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #171e29;
          --surface: #1f2834;
          --border: #2d3846;
          --text: #f1f5fa;
          --muted: #93a0b3;
          --accent: #7fe0d6;
          --on-accent: #08121f;
          --danger: #f06b60;
        }
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      p {
        margin: 0 0 10px;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      #toggle {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #toggle.stop {
        background: var(--danger);
        color: #fff;
      }
      #toggle:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #message {
        min-height: 1em;
        margin: 8px 0 0;
        color: var(--danger);
        font-size: 12px;
      }
      fieldset {
        margin: 12px 0 0;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      legend {
        padding: 0 4px;
        font-weight: 600;
      }
      label {
        display: grid;
        gap: 3px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      input,
      select {
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }
      details summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>AutoLibras Tradutor</h1>
    <p class="muted">Traduz para Libras o áudio desta aba, com o avatar sobre a página.</p>
    <p id="state" class="muted">Parado.</p>
    <button id="toggle" type="button">Traduzir esta aba</button>
    <p id="message" role="alert"></p>

    <form id="settings">
      <fieldset>
        <legend>Configurações</legend>
        <label>
          Servidor de transcrição (Whisper)
          <input name="serverUrl" type="url" spellcheck="false" required />
        </label>
        <label>
          Tradutor de glosa
          <select name="translator">
            <option value="vlibras">VLibras (usa regras locais se falhar)</option>
            <option value="regras">Regras locais</option>
          </select>
        </label>
        <label>
          Avatar
          <select name="avatar">
            <option value="icaro">Ícaro</option>
            <option value="hosana">Hosana</option>
            <option value="guga">Guga</option>
          </select>
        </label>
        <details>
          <summary>Avançado</summary>
          <label>
            Endereço do player
            <input name="playerUrl" type="url" spellcheck="false" />
          </label>
        </details>
        <p class="muted">
          A transcrição precisa do servidor Whisper rodando. O áudio da aba vai só para ele.
        </p>
      </fieldset>
    </form>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
