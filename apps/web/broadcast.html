<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoLibras · overlay</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #avatar {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.7);
        color: #fff;
        font-size: 14px;
        z-index: 2147483647;
      }
      #status:empty {
        display: none;
      }
      #caption {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: 8px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        color: #fff;
        font-size: clamp(16px, 5vw, 28px);
        line-height: 1.3;
        text-align: center;
        z-index: 2147483647;
      }
      #caption:empty,
      #caption[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Overlay para o OBS (fonte de navegador): só o avatar, fundo transparente. -->
    <p id="status">Carregando…</p>
    <p id="caption" hidden></p>
    <script type="module" src="/src/broadcast.ts"></script>
  </body>
</html>
