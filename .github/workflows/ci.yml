name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A extensão pronta para "Carregar sem compactação" no Chrome.
      - uses: actions/upload-artifact@v7
        with:
          name: autolibras-extension
          path: apps/extension/dist

  stt-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/stt-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/stt-server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # Os testes de integração (modelo Whisper real) ficam de fora: pedem AUTOLIBRAS_INTEGRATION=1.
      - run: pytest -q
      # A imagem leva o app web junto, então o contexto é a raiz do repositório.
      - run: docker build -t autolibras .
        working-directory: .

  # Publica o app no GitHub Pages depois que as verificações passam no main.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      # O site fica num subcaminho (/<repositório>/), então o build usa esse caminho como base.
      # Com o pacote de sinais (GPL-3.0, publicado em autolibras-sinais), o app e o overlay
      # usam o avatar próprio por padrão.
      - run: npm run build -w @autolibras/web -- --base=${{ steps.pages.outputs.base_path }}/
        env:
          VITE_SIGN_PACK_URL: https://lucas-arantes.github.io/autolibras-sinais/BR/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
